<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main>
      <section class="signup-section">
        <div class="container log-in-form">
          <h1 class="main-title">Welcome back!</h1>
          <h2>Enter your Credentials to access your account</h2>
          <form class="login-form" action="#" method="post">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
            />
            <div class="terms">
              <input type="checkbox" id="terms" name="terms" required />
              <label for="terms">Remember for 30 days</label>
            </div>
            <button type="submit">Login</button>
          </form>

          <p class="login-link">
            Don’t have an account? <a href="index.html">Log in</a>
          </p>
        </div>
        <div class="container">
          <img src="./images/main-img.jpg" width="781.5px" />
        </div>
      </section>
    </main>
    <script src="js/login.js"></script>
  </body>
</html>
